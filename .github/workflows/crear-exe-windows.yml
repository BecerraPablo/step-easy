
name: Crear EXE portable Windows

on:
  workflow_dispatch:

jobs:
  crear-exe:
    runs-on: windows-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Crear ejecutable
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name STEP-Portable visor_step.py

      - name: Guardar programa portable
        uses: actions/upload-artifact@v4
        with:
          name: STEP-Portable-Windows
          path: dist/STEP-Portable/
