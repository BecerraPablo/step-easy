name: Crear EXE portable Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Instalar librerias
        run: python -m pip install -r requirements.txt
      - name: Empaquetar portable
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name STEP-Portable --collect-all vtkmodules --collect-all OCP visor_step.py
      - name: Crear ZIP listo para copiar
        shell: pwsh
        run: Compress-Archive -Path dist/STEP-Portable -DestinationPath STEP-Portable-Windows.zip -Force
      - name: Publicar descargable
        uses: actions/upload-artifact@v4
        with:
          name: STEP-Portable-Windows
          path: STEP-Portable-Windows.zip
          retention-days: 30
